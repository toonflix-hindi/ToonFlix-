<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - ToonFlix</title>
<link rel="stylesheet" href="style.css">
<script>
  // 🔐 Login check — agar login nahi hai toh login page bhej do
  if (sessionStorage.getItem("toonflix_admin") !== "true" &&
      localStorage.getItem("toonflix_admin") !== "true") {
    window.location.replace("login.html");
  }
</script>
</head>
<body>

<header class="top-header">
  <a href="index.html" class="logo">
    <span class="logo-icon">🔥</span>
    <span class="logo-text">Toon<span>Flix</span></span>
    <span class="logo-badge">ADMIN</span>
  </a>
  <div class="header-actions">
    <a href="analytics.html" class="admin-btn" style="background: linear-gradient(135deg, #22d3ee, #3b82f6);">📊 Analytics</a>
    <a href="index.html" class="admin-btn">← Site</a>
    <button onclick="logout()" class="logout-btn">🚪 Logout</button>
  </div>
</header>

<div class="admin-container">

  <!-- Add Anime Form -->
  <section class="admin-section">
    <h2>➕ Add / Update Anime</h2>
    <div class="form-grid">
      <input id="aTitle" placeholder="Anime Title *">
      <input id="aPoster" placeholder="Poster Image URL *">
      <input id="aBanner" placeholder="Banner Image URL (optional)">
      <input id="aYear" placeholder="Year (e.g. 2024)">
      <input id="aRating" placeholder="Rating (e.g. 8.5)">
      <input id="aGenres" placeholder="Genres (comma separated: Action,Adventure)">
      <input id="aEpisodes" placeholder="Total Episodes">
      <textarea id="aDesc" placeholder="Description / Story"></textarea>
      <label class="checkbox-label">
        <input type="checkbox" id="aTop10"> Add to Top 10
      </label>
      <button class="primary-btn" onclick="saveAnime()">💾 Save Anime</button>
    </div>
  </section>

  <!-- Search Existing Anime -->
  <section class="admin-section">
    <h2>🔍 Search Existing Anime (Update karne ke liye)</h2>
    <input id="adminSearch" placeholder="Type anime name..." style="width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:#0f0f1a;color:#fff;font-family:inherit;font-size:0.9rem;outline:none;">
    <div class="cards-grid" id="adminSearchResults" style="margin-top:15px;"></div>
  </section>

  <!-- All Anime Manager -->
  <section class="admin-section">
    <h2>📚 All Anime (Delete / Edit)</h2>
    <div class="admin-list" id="adminList"></div>
  </section>

  <!-- Add Episode -->
  <section class="admin-section" id="episodeSection" style="display:none;">
    <h2>🎬 Add Episodes to: <span id="currentAnimeName"></span></h2>
    <div class="form-grid">
      <input id="epNumber" placeholder="Episode Number *" type="number">
      <input id="epTitle" placeholder="Episode Title (optional)">
      <input id="epLink" placeholder="🎬 Server 1 URL (Main) *">
      <input id="epLink2" placeholder="🎬 Server 2 URL (Backup - optional)">
      <input id="epLink3" placeholder="🎬 Server 3 URL (optional)">
      <input id="epTelegram" placeholder="📱 Telegram Link (channel/group/post URL)">
      <input id="epThumb" placeholder="Thumbnail URL (optional)">
      <button class="primary-btn" onclick="addEpisode()">➕ Add Episode</button>
    </div>
    <div id="episodeList" style="margin-top:15px;"></div>
  </section>

</div>

<footer class="premium-footer">
  <div class="footer-logo">🔥 Toon<span>Flix</span> Admin</div>
  <p class="footer-copy">© 2025 ToonFlix Hindi — Admin Panel</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="admin.js"></script>
<script>
function logout() {
  if (!confirm("Logout karna chahte ho?")) return;
  sessionStorage.removeItem("toonflix_admin");
  localStorage.removeItem("toonflix_admin");
  window.location.href = "login.html";
}
</script>
</body>
</html>
