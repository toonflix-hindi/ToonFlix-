<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ToonFlix Hindi - Premium Anime Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="cr-header">
  <a href="index.html" class="cr-logo">Toon<span>Flix</span></a>
  <div class="cr-header-actions">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" onclick="focusSearch()"><i class="fas fa-search"></i></button>
    <a href="profile.html" class="icon-btn"><i class="fas fa-user"></i></a>
    <a href="login.html" class="icon-btn"><i class="fas fa-cog"></i></a>
  </div>
</header>

<!-- ═══ CATEGORY TABS ═══ -->
<div class="category-tabs" id="categoryTabs">
  <div class="tab-item active" onclick="filterGenre('All', this)">All</div>
  <!-- Genres will be populated by script.js here -->
  <div class="tab-item" onclick="filterGenre('Action', this)">Action</div>
  <div class="tab-item" onclick="filterGenre('Comedy', this)">Comedy</div>
  <div class="tab-item" onclick="filterGenre('Drama', this)">Drama</div>
  <div class="tab-item" onclick="filterGenre('Fantasy', this)">Fantasy</div>
</div>

<!-- ═══ SEARCH BAR ═══ -->
<div class="search-wrap" id="searchWrap">
  <i class="fas fa-search search-icon"></i>
  <input type="text" id="searchInput" placeholder="Anime, movie, genre search karein...">
  <button id="searchBtn">GO</button>
</div>
<div class="search-results-box" id="searchResultsBox" style="display:none;">
  <div class="search-results-header">
    <span id="searchResultsTitle">Results</span>
    <button onclick="closeSearchResults()" class="search-close-btn">✕</button>
  </div>
  <div class="search-results-grid" id="searchResultsGrid"></div>
</div>

<!-- ═══ MAIN CONTENT ═══ -->
<main>

  <!-- HERO BANNER -->
  <section class="hero-section" id="heroSection">
    <div class="hero-slider" id="heroSlider"></div>
  </section>

  <!-- GENRE CHIPS (Hidden - Now using category tabs) -->
  <section class="chips-section" style="display:none;">
    <div class="chips-scroll" id="genreBtns"></div>
  </section>

  <!-- CONTINUE WATCHING -->
  <section class="row-section" id="continueWatchingSection" style="display:none;">
    <div class="section-header">
      <h2 class="section-title">Continue Watching <span class="jp">続きを見る</span></h2>
      <button onclick="clearHistory()" class="see-all">Clear</button>
    </div>
    <div class="h-scroll" id="continueWatching"></div>
  </section>

  <!-- NEWLY UPDATED -->
  <section class="row-section">
    <div class="section-header">
      <h2 class="section-title">Recently Added <span class="jp">最近追加</span></h2>
      <a href="#all" class="see-all">See All <i class="fas fa-chevron-right"></i></a>
    </div>
    <div class="h-scroll" id="newlyUpdated"></div>
  </section>

  <!-- TOP 10 -->
  <section class="row-section">
    <div class="section-header">
      <h2 class="section-title">Top 10 This Week <span class="jp">週間ランキング</span></h2>
    </div>
    <div class="h-scroll" id="top10Grid"></div>
  </section>

  <!-- ALL ANIME -->
  <section class="row-section" id="all">
    <div class="section-header">
      <h2 class="section-title">All Anime <span class="jp">すべてのアニメ</span></h2>
    </div>
    <div class="cards-grid" id="allAnime"></div>
  </section>

</main>

<!-- ═══ FOOTER ═══ -->
<footer class="premium-footer">
  <div class="footer-logo">Toon<span>Flix</span> Hindi</div>
  <p>Premium Anime Streaming • Made with ❤️ in India</p>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="#all">All Anime</a>
    <a href="profile.html">Profile</a>
    <a href="login.html">Admin</a>
  </div>
  <p class="footer-copy">© 2025 ToonFlix Hindi — All Rights Reserved</p>
</footer>

<!-- ═══ RANDOM ANIME BUTTON ═══ -->
<button class="random-anime-btn" id="randomAnimeBtn" onclick="openRandomAnime()">
  <i class="fas fa-dice"></i>
</button>

<!-- ═══ SCRIPTS ═══ -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="user.js"></script>
<script src="i18n.js"></script>
<script src="analytics.js"></script>
<script src="script.js"></script>
<script>
// Helper functions that script.js expects
function focusSearch() {
  document.getElementById("searchInput").focus();
  document.getElementById("searchWrap").scrollIntoView({behavior:"smooth", block:"center"});
}
function clearHistory() {
  if (!confirm("Watch history clear karein?")) return;
  localStorage.removeItem("toonflix_history");
  location.reload();
}
function toggleTheme() {
  if (typeof ToonTheme === "undefined") return;
  const t = ToonTheme.toggle();
  document.getElementById("themeBtn").innerHTML = t === "dark" ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
}
</script>
</body>
</html>
