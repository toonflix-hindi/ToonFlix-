<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ToonFlix Hindi - Watch Anime Online</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Top Header -->
<header class="top-header">
  <a href="index.html" class="logo">🔥 Toon<span>Flix</span></a>
  <div class="header-actions">
    <button class="icon-btn" onclick="focusSearch()">🔍</button>
    <a href="admin.html" class="admin-btn">Admin</a>
  </div>
</header>

<!-- Search Bar (expandable) -->
<div class="search-wrap" id="searchWrap">
  <input type="text" id="searchInput" placeholder="Anime, movie, genre search karein...">
  <button id="searchBtn">🔍</button>
</div>

<!-- Hero Banner Section -->
<section class="hero-section" id="heroSection">
  <div class="hero-slider" id="heroSlider"></div>
</section>

<!-- Genre Chips -->
<section class="chips-section">
  <div class="chips-scroll" id="genreBtns"></div>
</section>

<!-- Content Rows -->
<section class="row-section">
  <div class="row-header">
    <h2>🆕 Newly Updated</h2>
    <a href="#all" class="see-all">See All →</a>
  </div>
  <div class="row-scroll" id="newlyUpdated"></div>
</section>

<section class="row-section">
  <div class="row-header">
    <h2>🏆 Top 10 Anime</h2>
  </div>
  <div class="row-scroll" id="top10Grid"></div>
</section>

<section class="row-section" id="all">
  <div class="row-header">
    <h2>📺 All Anime</h2>
  </div>
  <div class="cards-grid" id="allAnime"></div>
</section>

<footer>
  <p>© 2025 ToonFlix Hindi — Made with ❤️</p>
</footer>

<!-- Bottom Nav (Mobile) -->
<nav class="bottom-nav">
  <a href="index.html" class="active">
    <span>🏠</span><small>Home</small>
  </a>
  <a href="javascript:focusSearch()">
    <span>🔍</span><small>Search</small>
  </a>
  <a href="javascript:scrollToGenres()">
    <span>🎭</span><small>Genres</small>
  </a>
  <a href="admin.html">
    <span>⚙️</span><small>Admin</small>
  </a>
</nav>

<script>
function focusSearch() {
  document.getElementById("searchInput").focus();
  document.getElementById("searchWrap").scrollIntoView({behavior:"smooth", block:"center"});
}
function scrollToGenres() {
  document.getElementById("genreBtns").scrollIntoView({behavior:"smooth", block:"center"});
}
</script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
  </html>
