<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ToonFlix Hindi - Premium Anime Streaming</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- ═══ PREMIUM HEADER ═══ -->
<header class="top-header">
  <a href="index.html" class="logo">
    <span class="logo-icon">🔥</span>
    <span class="logo-text">Toon<span>Flix</span></span>
    <span class="logo-badge">HINDI</span>
  </a>
  <div class="header-actions">
    <button class="icon-btn" onclick="focusSearch()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
    <a href="login.html" class="admin-btn">Admin</a>
  </div>
</header>

<!-- ═══ SEARCH ═══ -->
<div class="search-wrap" id="searchWrap">
  <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
  </svg>
  <input type="text" id="searchInput" placeholder="Anime, movie, genre search karein...">
  <button id="searchBtn">GO</button>
</div>

<!-- ═══ HERO BANNER ═══ -->
<section class="hero-section" id="heroSection">
  <div class="hero-slider" id="heroSlider"></div>
</section>

<!-- ═══ GENRE CHIPS ═══ -->
<section class="chips-section">
  <div class="chips-scroll" id="genreBtns"></div>
</section>

<!-- ═══ CONTINUE WATCHING ═══ -->
<section class="row-section" id="continueWatchingSection" style="display:none;">
  <div class="row-header">
    <div class="row-title-wrap">
      <span class="row-dot" style="background:#22d3ee;"></span>
      <h2>Continue Watching</h2>
    </div>
    <button onclick="clearHistory()" class="see-all">Clear</button>
  </div>
  <div class="row-scroll" id="continueWatching"></div>
</section>

<!-- ═══ NEWLY UPDATED ═══ -->
<section class="row-section">
  <div class="row-header">
    <div class="row-title-wrap">
      <span class="row-dot" style="background:#ff2d92;"></span>
      <h2>Newly Updated</h2>
    </div>
    <a href="#all" class="see-all">See All →</a>
  </div>
  <div class="row-scroll" id="newlyUpdated"></div>
</section>

<!-- ═══ TOP 10 ═══ -->
<section class="row-section">
  <div class="row-header">
    <div class="row-title-wrap">
      <span class="row-dot" style="background:#fbbf24;"></span>
      <h2>Top 10 This Week</h2>
    </div>
  </div>
  <div class="row-scroll" id="top10Grid"></div>
</section>

<!-- ═══ ALL ANIME ═══ -->
<section class="row-section" id="all">
  <div class="row-header">
    <div class="row-title-wrap">
      <span class="row-dot" style="background:#a855f7;"></span>
      <h2>All Anime</h2>
    </div>
  </div>
  <div class="cards-grid" id="allAnime"></div>
</section>

<!-- ═══ PREMIUM FOOTER ═══ -->
<footer class="premium-footer">
  <div class="footer-logo">🔥 Toon<span>Flix</span> Hindi</div>
  <p>Premium Anime Streaming • Made with ❤️ in India</p>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="#all">All Anime</a>
    <a href="login.html">Admin</a>
  </div>
  <p class="footer-copy">© 2025 ToonFlix Hindi — All Rights Reserved</p>
</footer>

<!-- ═══ PREMIUM BOTTOM NAV ═══ -->
<nav class="bottom-nav">
  <a href="index.html" class="active">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>
    </svg>
    <small>Home</small>
  </a>
  <a href="javascript:focusSearch()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <small>Search</small>
  </a>
  <a href="javascript:scrollToGenres()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
    <small>Genres</small>
  </a>
  <a href="login.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    <small>Admin</small>
  </a>
</nav>

<script>
function focusSearch() {
  document.getElementById("searchInput").focus();
  document.getElementById("searchWrap").scrollIntoView({behavior:"smooth", block:"center"});
}
function scrollToGenres() {
  document.getElementById("genreBtns").scrollIntoView({behavior:"smooth", block:"center"});
}
function clearHistory() {
  if (!confirm("Watch history clear karein?")) return;
  localStorage.removeItem("toonflix_history");
  location.reload();
}
</script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="analytics.js"></script>
<script src="script.js"></script>
</body>
</html>
